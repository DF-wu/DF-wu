name: Refresh public profile metrics

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/profile_metrics.py'
      - 'scripts/test_profile_metrics.py'
      - '.github/workflows/profile-summary-cards.yml'

permissions:
  contents: read

concurrency:
  group: profile-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test public-source parsing and failure handling
        run: python3 -m unittest discover -s scripts -p 'test_profile_metrics.py' -v

  refresh:
    if: github.event_name != 'pull_request' && github.repository == 'DF-wu/DF-wu' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Refresh each source independently
        id: refresh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/profile_metrics.py
      - name: Commit validated snapshots
        if: steps.refresh.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets/profile/github-*.svg assets/profile/wakatime-*.svg assets/profile/github.json assets/profile/wakatime.json assets/profile/metrics.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh public activity snapshots'
          gh auth setup-git
          git push origin HEAD:master
      - name: Report partial or total refresh failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'A public source or output write failed. No snapshots from this run were published.'
          exit 1
